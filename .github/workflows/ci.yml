name: Build PSIQUE 32-bit (Windows x86 & Linux)

on:
  push:
    branches: [ 32-bit ]
  pull_request:
    branches: [ 32-bit ]

jobs:
  build-windows-32bit:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11 (32-bit x86)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x86'

    - name: Install 32-bit dependencies (PyQt5)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Windows 32-bit Executable (PyInstaller)
      run: |
        python -m PyInstaller SistemaClinico.spec --noconfirm --clean

    - name: Package PSIQUE_Windows_32bit.zip
      shell: powershell
      run: |
        Copy-Item "version.json" "dist\SistemaClinico\version.json" -Force
        Compress-Archive -Path "dist\SistemaClinico\*" -DestinationPath "PSIQUE_Windows_32bit.zip" -Force

    - name: Upload Windows 32-bit Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSIQUE-Windows-32bit
        path: PSIQUE_Windows_32bit.zip

  package-linux-32bit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Package PSIQUE_Linux_32bit.tar.gz
      run: |
        mkdir -p pkg_linux_32bit
        cp main.py requirements.txt version.json install_linux.sh .env.example pkg_linux_32bit/
        cp -r core database ui styles data pkg_linux_32bit/
        find pkg_linux_32bit -name "__pycache__" -type d -exec rm -rf {} +
        chmod +x pkg_linux_32bit/install_linux.sh
        tar -czf PSIQUE_Linux_32bit.tar.gz -C pkg_linux_32bit .

    - name: Upload Linux 32-bit Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSIQUE-Linux-32bit
        path: PSIQUE_Linux_32bit.tar.gz
