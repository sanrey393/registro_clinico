name: Build & Release PSIQUE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows Executable (PyInstaller)
      run: |
        python -m PyInstaller SistemaClinico.spec --noconfirm --clean

    - name: Copy version.json & Package SistemaClinico.zip
      shell: powershell
      run: |
        Copy-Item "version.json" "dist\SistemaClinico\version.json" -Force
        Compress-Archive -Path "dist\SistemaClinico\*" -DestinationPath "SistemaClinico.zip" -Force

    - name: Upload Windows Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SistemaClinico-Windows-x64
        path: SistemaClinico.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux Qt6 system libraries & Python dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Linux Executable (PyInstaller)
      run: |
        python -m PyInstaller SistemaClinico.spec --noconfirm --clean

    - name: Package PSIQUE-Linux-x86_64.tar.gz
      run: |
        cp version.json dist/SistemaClinico/version.json
        cp install_linux.sh dist/SistemaClinico/install_linux.sh
        chmod +x dist/SistemaClinico/install_linux.sh
        tar -czf PSIQUE-Linux-x86_64.tar.gz -C dist/SistemaClinico .

    - name: Upload Linux Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PSIQUE-Linux-x86_64
        path: PSIQUE-Linux-x86_64.tar.gz

  publish-release:
    needs: [ build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: SistemaClinico-Windows-x64

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: PSIQUE-Linux-x86_64

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SistemaClinico.zip
          PSIQUE-Linux-x86_64.tar.gz
        generate_release_notes: true
